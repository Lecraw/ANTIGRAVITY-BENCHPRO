<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BenchPro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="minilogo.png" type="image/png">
</head>
<body>
  <div class="auth-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
    <div class="auth-card" style="max-width:400px;width:100%">
      <div class="auth-logo" style="margin-bottom:24px">
        <img src="logo.png" alt="BenchPro" style="width:64px;height:64px">
        <h1 class="auth-brand">BENCH<span>PRO</span></h1>
        <p class="auth-tagline">Reset your password</p>
      </div>
      <div id="form-view" class="auth-view active" style="padding:28px">
        <div id="form-error" style="display:none;margin-bottom:16px;padding:12px;background:rgba(239,68,68,0.15);border-radius:8px;color:var(--red);font-size:14px"></div>
        <div id="form-success" style="display:none;margin-bottom:16px;padding:12px;background:rgba(34,197,94,0.15);border-radius:8px;color:var(--green);font-size:14px"></div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="forgot-email" placeholder="your@email.com">
        </div>
        <button class="btn btn-primary auth-btn" id="submit-btn" style="width:100%">Send reset link</button>
        <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
          <a href="/" style="color:var(--orange)">Back to coach login</a> · <a href="/student" style="color:var(--orange)">Player login</a>
        </p>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('form-error');
      const successEl = document.getElementById('form-success');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
        successEl.style.display = 'none';
      }
      function showSuccess(msg) {
        successEl.textContent = msg;
        successEl.style.display = 'block';
        errEl.style.display = 'none';
      }

      btn.addEventListener('click', async () => {
        const email = document.getElementById('forgot-email').value.trim();
        errEl.style.display = 'none';
        successEl.style.display = 'none';
        if (!email) { showError('Enter your email'); return; }
        if (!/\S+@\S+\.\S+/.test(email)) { showError('Enter a valid email'); return; }
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showSuccess(data.message || 'If that email exists, we sent a reset link. Check your inbox.');
          } else {
            showError(data.error || 'Something went wrong');
          }
        } catch (e) {
          showError('Could not connect. Please try again.');
        }
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      });
    })();
  </script>
</body>
</html>
