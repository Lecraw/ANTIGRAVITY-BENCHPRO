<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — BenchPro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="minilogo.png" type="image/png">
</head>
<body>
  <div class="auth-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
    <div class="auth-card" style="max-width:400px;width:100%">
      <div class="auth-logo" style="margin-bottom:24px">
        <img src="logo.png" alt="BenchPro" style="width:64px;height:64px">
        <h1 class="auth-brand">BENCH<span>PRO</span></h1>
        <p class="auth-tagline">Reset your password</p>
      </div>
      <div id="reset-form" class="auth-view active" style="padding:28px">
        <div id="reset-error" class="auth-error-popup" style="display:none;margin-bottom:16px"></div>
        <div class="form-group">
          <label class="form-label">New password</label>
          <input type="password" class="form-input" id="new-password" placeholder="Enter new password" minlength="4">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-input" id="confirm-password" placeholder="Confirm new password">
        </div>
        <button class="btn btn-primary auth-btn" id="reset-btn" style="width:100%">Reset Password</button>
      </div>
      <div id="reset-success" style="display:none;padding:28px;text-align:center">
        <p style="font-size:18px;margin-bottom:16px">Password updated successfully.</p>
        <a href="/" class="btn btn-primary" style="margin-right:8px">Coach login</a>
        <a href="/student" class="btn btn-secondary">Player login</a>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const form = document.getElementById('reset-form');
      const success = document.getElementById('reset-success');
      const btn = document.getElementById('reset-btn');
      const errEl = document.getElementById('reset-error');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = 'block';
      }

      if (!token) {
        showError('Invalid or missing reset link. Request a new one from the login page.');
        btn.disabled = true;
        return;
      }

      btn.addEventListener('click', async () => {
        const pw = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        errEl.style.display = 'none';
        if (!pw || pw.length < 4) {
          showError('Password must be at least 4 characters');
          return;
        }
        if (pw !== confirm) {
          showError('Passwords do not match');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: pw })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            form.style.display = 'none';
            success.style.display = 'block';
          } else {
            showError(data.error || 'Failed to reset password');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
          }
        } catch (e) {
          showError('Could not connect. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      });
    })();
  </script>
</body>
</html>
